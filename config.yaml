# Project configuration
#
# Copy this file to `config.local.yaml` and edit the values for your machine
# if you need something different from the defaults below — `config.local.yaml`
# is git-ignored, so your local paths never get committed.
#
# All paths are resolved relative to the repository root, so the project
# runs the same way regardless of where it's cloned to.

data:
  # Where raw/large input data lives (HDF5 cubes, shapefiles, ...).
  # Default keeps everything inside the repo under ./data, mirroring the
  # ground-truth shapefiles already committed there.
  root: ./data

  # Sentinel-2 tile this notebook/run is working with.
  tile_id: T29TPG

  # Location of the HDF5 cube, relative to <data.root>.
  # The cube is large (~32 GB) and kept local only — git-ignored via the
  # `data/hdf5/` and `*.h5` rules in .gitignore.
  hdf5_filename: hdf5/T29TPG.h5

output:
  # Where generated figures/results are written.
  # Mirrors <output.figures_dir>/<tile_id>/...
  figures_dir: ./outputs/figures

model:
  # Which adapter to use — see inference/adapters/ (model.kind → adapter module).
  kind: swin_ynet
  # Fine-tuned Swin-YNet weights and the inference wrapper package.
  # Both live under models/ which is git-ignored (kept local only) — see .gitignore.
  weights_path: ./models/swin_ynet/model_weights/393c_cutsTversky_ema_W010402_LR01_G00311224_val_pCuts30_compact_16bits20260513155028_best.pth
  package_dir:  ./models/swin_ynet/bacdm_predict

inference:
  # Where burned-area prediction rasters are written.
  predictions_dir: ./outputs/predictions
  batch_size: 8
  # Only scenes in these categories are eligible — default full_clear only
  # (full swath coverage AND cloud <= 10%). This excludes edge_pass, clouded and
  # partial_clear scenes entirely. See scene categories in scene_select.py.
  usable_categories: ["full_clear"]
  # Auto-selection windows for the single global before/after scene pair (ISO dates).
  # before: cleanest full_clear pre-fire baseline (pre-dates the first large fire,
  #         Jul 23 — see documents/evaluation_protocol.md §5.2).
  # after:  latest full_clear scene of the fire season. NOTE: the last full_clear
  #         acquisition is 2025-10-15, so the Oct 19 Montalegre fire (248 ha) is not
  #         bracketed; every other large fire is. Override with --before/--after-date.
  before_window: ["2025-07-01", "2025-07-22"]
  after_window:  ["2025-10-01", "2025-12-31"]
  # NOTE: the "burned" class index is model-specific and now lives in each
  # adapter (BURNED_CLASS) — swin_ynet=2 (Fires), efficientnet_b2=1 (Burned).

constants:
  pixel_size_m: 10.0
  tile_crs: "EPSG:32629"   # UTM zone 29N — matches T29TPG
  buffer_m: 5000
  nodata_val: 65535
  xys_sentinel: -9999
