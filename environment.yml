name: veg-s2s
channels:
  - conda-forge
dependencies:
  - python=3.11
  # Geospatial stack — installed via conda-forge so GDAL/PROJ/GEOS system
  # libraries and their Python bindings stay in sync (this is the usual
  # source of "works on my machine" pain with geopandas/fiona/rasterio).
  - geopandas=0.14.*
  - shapely=2.0.*
  - fiona=1.9.*
  - contextily=1.5.*
  - rasterio=1.3.*
  - pyproj=3.6.*
  # Core scientific stack
  - numpy=1.26.*
  - pandas=2.1.*
  - matplotlib=3.8.*
  - h5py=3.10.*
  # Notebook environment
  - jupyterlab=4.*
  - ipykernel=6.*
  # Config loading
  - pyyaml=6.*
  - pip
  - pip:
      - -r requirements.txt
