name: veg-s2s
channels:
  - conda-forge
dependencies:
  - python=3.11
  # Geospatial stack — installed via conda-forge so GDAL/PROJ/GEOS system
  # libraries and their Python bindings stay in sync (this is the usual
  # source of "works on my machine" pain with geopandas/fiona/rasterio).
  - geopandas=0.14.*
  - shapely=2.0.*
  - fiona=1.9.*
  - contextily=1.5.*
  - rasterio=1.3.*
  - pyproj=3.6.*
  # Core scientific stack
  - numpy=1.26.*
  - pandas=2.1.*
  - matplotlib=3.8.*
  - h5py=3.10.*
  # Model inference deps (instructor's EfficientNet-B2 package)
  - scipy=1.*            # predict.py: scipy.ndimage (component labelling); also McNemar's test (chi2)
  - scikit-image=0.22.*  # predict.py: skimage.morphology (closing, disk)
  - pillow=10.*          # dataset.py: PIL (label loading)
  - tqdm=4.*             # progress bars for full-tile chip runs
  - scikit-learn=1.4.*   # evaluation notebook: confusion_matrix, MCC, precision/recall/F1
  # Notebook environment
  - jupyterlab=4.*
  - ipykernel=6.*
  - plotly=5.*           # evaluation notebook: interactive metric/scatter/heatmap plots
  # Config loading
  - pyyaml=6.*
  # Local burned-area app (app.py): Streamlit UI + folium interactive map.
  # folium needs pillow (already pinned above) for its image overlays.
  - streamlit=1.51.*
  - folium=0.20.*
  # - leafmap=0.*   # optional upgrade for smoother full-resolution map tiling
  - pip
  - pip:
      - -r requirements.txt
